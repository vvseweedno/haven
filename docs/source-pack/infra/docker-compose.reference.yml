# Reference only. Astra should generate the final root docker-compose.yml.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: haven
      POSTGRES_PASSWORD: haven_dev
      POSTGRES_DB: haven
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: haven
      MINIO_ROOT_PASSWORD: haven_dev_secret
    ports: ["9000:9000", "9001:9001"]
