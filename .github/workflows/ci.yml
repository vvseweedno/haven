name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static and unit verification
        run: npm test

      - name: Production build
        run: npm run build

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser verification runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start > /tmp/haven-server.log 2>&1 &
          echo $! > /tmp/haven-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:41731/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/haven-server.log
          exit 1

      - name: Browser interface verification
        env:
          HAVEN_TEST_URL: http://localhost:41731
        run: python scripts/test-ui.py

      - name: Browser security verification
        env:
          HAVEN_TEST_URL: http://localhost:41731
        run: python scripts/test-security-ui.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haven-browser-evidence
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/haven-server.log || true
